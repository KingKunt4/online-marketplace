{% extends 'base.html' %}
{% block title %}Inbox{% endblock %}
{% block content %}
    <h1>Messages</h1>
    <div class="message-space">
        {% for convo in conversations %}
        <a href="#">
            <div class="message-card">
                
                    <div class="message-img"><img src="{{ convo.item.image.url }}" alt="product image"></div>
                    <div class="card-text">
                        <p><strong>{{ convo.item.created_by }}</strong> | {{ convo.item.created_at }}</p>
                        <p>{{ convo.item.name }}</p>
                    </div>
            </div>
        </a>
        {% endfor %}
    </div>
{% endblock %}
