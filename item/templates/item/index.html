{% extends 'base.html' %}
{% load static %}
{% block title %}Welcome{% endblock %}
{% block content %}
    <div class="items-page">
        <div class="filter">
            <div class="search-bar">
                <form method="GET" action="{% url 'item:index' %}">
                    <input name="query" type="text" value="{{ query }}" placeholder="find an item...">
                    <button class="search-btn" type="submit">search</button>
                </form>
            </div>
        </div>
    
        <div class="items">
            <div class="item-space">
                {% for item in item %}
                    <div class="item-card">
                        <a href="{% url 'item:detail' item.id %}">
                            <div><img src="{{ item.image.url }}" alt="product image"></div>
                            <div class="card-text">
                                <p><strong>{{ item.name }}</strong></p>
                                <p>₦{{ item.price }}</p>
                            </div>
                        </a>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
