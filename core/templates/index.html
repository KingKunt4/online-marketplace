{% extends 'base.html' %}
{% load static %}
{% block title %}Welcome{% endblock %}
{% block content %}
    <div class="items">
        <h1>Newest items</h1>
        <div class="items-space">
            {% for item in items %}
                <div class="item-card">
                    <a href="#">
                        <div><img src="{{ item.image.url }}" alt="product image"></div>
                        <div class="card-text">
                            <h2>{{ item.name }}</h2>
                            <p>{{ item.price }}</p>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
